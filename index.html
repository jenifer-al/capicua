              <p> se refiere a cualquier número que se lee igual de izquierda a derecha que de derecha a izquierda.</p>
              <p>Ejemplos: <code>161, 2992, 3003, 91019, 5005, 292, 2882, 2442, 9102019</code>.</p>
              <p>La palabra capicúa viene del catalán: <b>cap</b> i <b>cua</b>, ‘cabeza y cola’.</p>
